name: Build e publicar .exe

# Dispara quando você envia uma tag de versão, ex.:
#     git tag v1.0.0
#     git push origin v1.0.0
# O GitHub compila o .exe no Windows e o publica na aba "Releases".
on:
  push:
    tags:
      - "v*"
  # Permite rodar manualmente pela aba Actions (gera artefato, sem release).
  workflow_dispatch:

permissions:
  contents: write   # necessário para criar a Release e anexar o .exe

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências (runtime + PyInstaller)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Compilar o executável
        run: python -m PyInstaller eye-rest-reminder.spec --noconfirm

      - name: Enviar o .exe como artefato do build
        uses: actions/upload-artifact@v4
        with:
          name: eye-rest-reminder-exe
          path: dist/eye-rest-reminder.exe

      - name: Publicar na Release (somente em tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/eye-rest-reminder.exe
          generate_release_notes: true
